name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to the gh-pages branch, which GitHub
# Pages serves ("Deploy from a branch": gh-pages, root). Skipped in private
# repositories, where free accounts can't use Pages.
on:
  push:
    branches: [main, claude/gods-eye-uap-tracker-l2bgt4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Case pages and the sitemap need the public address.
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Publish dist/ to the gh-pages branch
        if: ${{ !github.event.repository.private }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
